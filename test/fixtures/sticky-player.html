<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>播放器顶部驻留测试页</title>
    <link rel="stylesheet" href="../../src/content/sticky-player.css">
    <style>
      * { box-sizing: border-box; }
      body { min-height: 3600px; margin: 0; color: #18191c; background: #f6f7f9; font-family: sans-serif; }
      header { height: 180px; padding: 48px; background: #fff; }
      #playerWrap { width: min(720px, calc(100% - 48px)); margin: 0 auto; }
      #bilibili-player { width: 100%; aspect-ratio: 16 / 9; }
      .bpx-docker { width: 100%; height: 100%; }
      .bpx-player-container { display: grid; width: 100%; height: 100%; place-items: center; color: #fff; background: #18191c; }
      .comments { width: min(720px, calc(100% - 48px)); min-height: 2600px; margin: 24px auto; padding: 28px; background: #fff; }
      .comments p { min-height: 120px; border-bottom: 1px solid #eee; }
    </style>
    <script>
      window.chrome = {
        storage: {
          sync: {
            get: async () => ({
              settings: {
                schemaVersion: 1,
                stickyPlayer: {
                  enabled: true,
                  topOffset: 8,
                  maxViewportHeight: 40
                }
              }
            })
          },
          onChanged: { addListener: () => {} }
        }
      };

      window.addEventListener("scroll", () => {
        const container = document.querySelector(".bpx-player-container");
        if (container && window.scrollY > 180) {
          container.setAttribute(
            "style",
            "position: fixed; right: 84px; bottom: 48px; width: 320px; height: 180px"
          );
        } else {
          container?.removeAttribute("style");
        }
      });
    </script>
  </head>
  <body>
    <header>
      <strong>Bilibili 工具箱 · DOM 行为测试</strong>
      <p>向下滚动后，原播放器应固定在顶部。</p>
    </header>
    <div id="playerWrap" class="player-wrap">
      <div id="bilibili-player">
        <div class="bpx-docker bpx-docker-major">
          <div class="bpx-player-container">模拟 B 站播放器</div>
        </div>
      </div>
    </div>
    <main class="comments">
      <h1>评论区</h1>
      <p>评论内容一</p>
      <p>评论内容二</p>
      <p>评论内容三</p>
      <p>评论内容四</p>
    </main>

    <script src="../../src/shared/settings.js"></script>
    <script src="../../src/shared/sticky-layout.js"></script>
    <script src="../../src/content/sticky-player.js"></script>
  </body>
</html>
